name: Adaptive Tutor CI

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        pip install -r adaptive_tutor/requirements.txt

    - name: Check Python Syntax
      run: |
        python -m py_compile adaptive_tutor/*.py
    - 
      
      name: Run Python Tests
      run:  pytest

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Node Packages
      run: npm install

    - name: Check Node Syntax
      run: node --check app.js